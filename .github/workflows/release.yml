# Publicação das imagens (DT20): quando uma versão é publicada no GitHub, constrói as duas imagens a
# partir da etiqueta, analisa-as com o Trivy e envia-as para o GitHub Container Registry:
#   ghcr.io/<dono>/matriz-backend:<versão>   ghcr.io/<dono>/matriz-frontend:<versão>
# Uma versão final (não pré-lançamento) recebe também a etiqueta `latest`.
#
# Só usa o GITHUB_TOKEN da execução, com permissão de escrita nos pacotes apenas neste workflow; o
# ci.yml continua só com leitura. Os testes não se repetem aqui: a etiqueta é criada num commit do
# main em que o CI já passou.
name: Publicar imagens

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

concurrency:
  group: publicar-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publicar:
    name: Construir, analisar e publicar
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Os valores do evento entram como variáveis de ambiente, nunca interpolados nos comandos.
      TAG_NAME: ${{ github.event.release.tag_name }}
      PRERELEASE: ${{ github.event.release.prerelease }}
      TRIVY_IMAGE: aquasec/trivy:0.76.2
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name }}
      - name: Versão a partir da etiqueta
        run: |
          if ! printf '%s' "$TAG_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "A etiqueta '$TAG_NAME' não é uma versão (vX.Y.Z ou vX.Y.Z-pré)." >&2
            exit 1
          fi
          version="${TAG_NAME#v}"
          declared="$(node -p "require('./package.json').version")"
          if [ "$version" != "$declared" ]; then
            echo "A etiqueta ($version) não coincide com a versão do package.json ($declared)." >&2
            exit 1
          fi
          {
            echo "VERSION=$version"
            echo "REGISTRY_PATH=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"
          } >> "$GITHUB_ENV"
      - name: Construir as imagens
        run: |
          for component in backend frontend; do
            docker build -f "$component/Dockerfile" \
              --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
              --label "org.opencontainers.image.revision=$GITHUB_SHA" \
              --label "org.opencontainers.image.version=$VERSION" \
              -t "$REGISTRY_PATH/matriz-$component:$VERSION" .
          done
      - name: Análise das imagens (Trivy) — não publica com vulnerabilidades altas ou críticas com correção
        run: |
          for component in backend frontend; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY_IMAGE" image \
              --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
              "$REGISTRY_PATH/matriz-$component:$VERSION"
          done
      - name: Iniciar sessão no GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Publicar
        run: |
          for component in backend frontend; do
            image="$REGISTRY_PATH/matriz-$component"
            docker push "$image:$VERSION"
            if [ "$PRERELEASE" != "true" ]; then
              docker tag "$image:$VERSION" "$image:latest"
              docker push "$image:latest"
            fi
            echo "Publicada: $image:$VERSION" >> "$GITHUB_STEP_SUMMARY"
          done
      - name: Terminar a sessão
        if: always()
        run: docker logout ghcr.io
