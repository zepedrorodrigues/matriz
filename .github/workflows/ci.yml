# Integração contínua (DT18, DT19): em cada pull request e em cada push para o main, a análise estática, os
# testes e o build; depois, e só se passarem, as imagens Docker, a sua análise e os testes End-to-End
# contra a aplicação completa do compose.yaml. Os comandos são os do README, sem variantes só do CI.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Análise estática e testes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # A base vive só durante o job e não é acessível de fora: a palavra-passe não é um segredo (SEC08
      # aplica-se a credenciais de ambientes reais).
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: matriz
      DB_PASSWORD: so-para-o-ci
      DB_NAME: matriz
      DB_NAME_TEST: matriz_test
      APP_TIME_ZONE: Europe/Lisbon
      OIDC_ISSUER: http://localhost:8080/realms/matriz
      OIDC_AUDIENCE: matriz-api
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: so-para-o-ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: Role matriz sem privilégios e base matriz_test
        # Como o scripts/db-setup.sql: o role da aplicação é dono da base mas não é superutilizador
        # (os testes CAT04 verificam que o REVOKE sobre o histórico o trava).
        run: |
          docker exec ${{ job.services.postgres.id }} psql -v ON_ERROR_STOP=1 -U postgres             -c "CREATE ROLE matriz LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE PASSWORD '$DB_PASSWORD'"             -c "CREATE DATABASE matriz_test OWNER matriz ENCODING 'UTF8' TEMPLATE template0"
      - name: Análise estática (ESLint)
        run: npm run lint
      - name: Tipos do backend
        run: npx tsc --noEmit -p tsconfig.json
        working-directory: backend
      - name: Tipos do frontend
        run: npx tsc --noEmit -p tsconfig.json
        working-directory: frontend
      - name: Testes unitários e de integração
        run: npm test
      - name: Compilar
        run: npm run build
      - name: Dependências de produção sem vulnerabilidades altas ou críticas
        run: npm audit --omit=dev --audit-level=high

  entrega:
    name: Imagens Docker e testes End-to-End
    # As imagens só se constroem depois de a análise estática, os testes e o build passarem.
    needs: verificar
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      KEYCLOAK_ADMIN_USER: admin-ci
      TRIVY_IMAGE: aquasec/trivy:0.76.2
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Gerar as palavras-passe desta execução
        # Aleatórias, mascaradas nos logs e válidas só para os contentores deste job.
        run: |
          for name in DB_PASSWORD KEYCLOAK_ADMIN_PASSWORD MATRIZ_DEMO_PASSWORD; do
            value="$(openssl rand -hex 24)"
            echo "::add-mask::$value"
            echo "$name=$value" >> "$GITHUB_ENV"
          done
      - name: Validar o compose.yaml
        run: docker compose config -q
      - name: Construir as imagens
        run: docker compose build
      - name: Análise das imagens (Trivy) — falha com vulnerabilidades altas ou críticas com correção
        run: |
          for image in matriz-backend matriz-frontend; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY_IMAGE" image \
              --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "$image"
          done
      - name: Arrancar a aplicação completa (compose)
        run: docker compose up -d --wait
      - name: Estado dos contentores
        run: docker compose ps -a
      - name: Instalar dependências dos testes
        run: npm ci
      - name: Testes End-to-End (Playwright no Chrome do runner)
        run: npm run test:e2e
      - name: Registos dos contentores
        if: failure()
        run: docker compose logs --tail=100
      - name: Guardar capturas de ecrã e traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: e2e/test-results/
          retention-days: 7
