# Matriz completa em contentores (DT19, architecture.md §8): proxy, frontend, duas instâncias do backend,
# PostgreSQL e Keycloak, com as migrations, os dados de demonstração e as palavras-passe das contas
# fictícias aplicados por passos próprios. Serve para executar e verificar a aplicação num ambiente
# reproduzível. Não é a configuração de produção — essa depende do fornecedor (DT06) e da réplica e
# cópias de segurança (DT13).
#
# A partir da raiz do repositório, com o .env preenchido (ver .env.example):
#   docker compose up --build -d --wait     # aplicação em http://localhost:5173
#   docker compose down                     # parar; os dados ficam nos volumes
#   docker compose down -v                  # parar e apagar os dados (base e Keycloak)
#
# O emissor OIDC tem de ter o mesmo endereço para o browser e para o backend dentro do contentor.
# Usa-se keycloak.localhost: os browsers resolvem *.localhost para o próprio computador, e na rede do
# compose o nome é um alias do serviço keycloak. Não é preciso mexer no ficheiro hosts.

name: matriz

x-oidc-issuer: &oidc-issuer http://keycloak.localhost:8080/realms/matriz

x-backend: &backend
  image: matriz-backend
  restart: unless-stopped
  environment: &backend-env
    PORT: "3000"
    APP_TIME_ZONE: ${APP_TIME_ZONE:-Europe/Lisbon}
    DB_HOST: db
    DB_PORT: "5432"
    DB_USER: matriz
    DB_PASSWORD: ${DB_PASSWORD:?Falta DB_PASSWORD no .env}
    DB_NAME: matriz
    OIDC_ISSUER: *oidc-issuer
    OIDC_AUDIENCE: ${OIDC_AUDIENCE:-matriz-api}
  depends_on:
    migrate:
      condition: service_completed_successfully
    keycloak:
      condition: service_healthy

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      # Superutilizador do contentor: só o db-init.sh o usa. Sem DB_SUPERUSER_PASSWORD, fica igual à do role.
      POSTGRES_PASSWORD: ${DB_SUPERUSER_PASSWORD:-${DB_PASSWORD:?Falta DB_PASSWORD no .env}}
      MATRIZ_DB_PASSWORD: ${DB_PASSWORD:?Falta DB_PASSWORD no .env}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./deploy/db-init.sh:/docker-entrypoint-initdb.d/10-matriz.sh:ro
    healthcheck:
      # Durante o primeiro arranque o servidor só escuta no socket: a verificação por TCP só passa
      # depois de o db-init.sh ter corrido.
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "matriz", "-d", "matriz"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Fornecedor de identidade (DT04), em modo de desenvolvimento, com o realm versionado (sem palavras-passe).
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    restart: unless-stopped
    command: ["start-dev", "--import-realm", "--http-port=8080", "--health-enabled=true"]
    environment:
      # Só têm efeito no primeiro arranque, quando o realm master ainda não tem administrador.
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:?Falta KEYCLOAK_ADMIN_USER no .env}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Falta KEYCLOAK_ADMIN_PASSWORD no .env}
    ports:
      - "8080:8080"
    volumes:
      # As contas da Matriz ficam ligadas à identidade do Keycloak (RN35): os dois volumes vivem juntos.
      - keycloak-data:/opt/keycloak/data
      - ./keycloak/realm-matriz.json:/opt/keycloak/data/import/realm-matriz.json:ro
    networks:
      default:
        aliases:
          - keycloak.localhost
    healthcheck:
      # A imagem não tem curl nem wget: pedido HTTP à porta de gestão pelo /dev/tcp do bash.
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"status": "UP"' <&3
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 30s

  # Passo próprio: define a palavra-passe das contas fictícias pela API de administração do Keycloak.
  keycloak-setup:
    image: node:24-slim
    restart: "no"
    working_dir: /work
    command: ["node", "scripts/keycloak-ci.mjs"]
    environment:
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_ADMIN_USER: ${KEYCLOAK_ADMIN_USER:?Falta KEYCLOAK_ADMIN_USER no .env}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Falta KEYCLOAK_ADMIN_PASSWORD no .env}
      MATRIZ_DEMO_PASSWORD: ${MATRIZ_DEMO_PASSWORD:?Falta MATRIZ_DEMO_PASSWORD no .env}
    volumes:
      - ./scripts/keycloak-ci.mjs:/work/scripts/keycloak-ci.mjs:ro
      - ./keycloak/realm-matriz.json:/work/keycloak/realm-matriz.json:ro
    depends_on:
      keycloak:
        condition: service_healthy

  # Passo de publicação: migrations com a imagem do backend, antes de qualquer instância arrancar.
  migrate:
    <<: *backend
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: "no"
    command: ["node", "../node_modules/typeorm/cli.js", "migration:run", "-d", "dist/src/shared/database/data-source.js"]
    depends_on:
      db:
        condition: service_healthy

  # Dados de demonstração fictícios (idempotente, nunca apaga). O seed recusa NODE_ENV=production.
  seed:
    <<: *backend
    restart: "no"
    environment:
      <<: *backend-env
      NODE_ENV: development
    command: ["node", "dist/seed/seed.js"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  backend-1: *backend
  backend-2: *backend

  frontend:
    image: matriz-frontend
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    environment:
      OIDC_AUTHORITY: *oidc-issuer
      OIDC_CLIENT_ID: ${VITE_OIDC_CLIENT_ID:-matriz-web}
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/config.js"]
      interval: 5s
      timeout: 3s
      retries: 10

  proxy:
    image: nginx:1.30-alpine
    restart: unless-stopped
    ports:
      - "5173:80"
    volumes:
      - ./deploy/proxy.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      frontend:
        condition: service_healthy
      backend-1:
        condition: service_healthy
      backend-2:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
      keycloak-setup:
        condition: service_completed_successfully
    healthcheck:
      # Atravessa o proxy até ao backend e à base de dados.
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/api/health"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
  keycloak-data:
