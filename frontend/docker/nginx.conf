# Servidor dos ficheiros estáticos do frontend. O /api não passa por aqui: o proxy de entrada
# encaminha-o para o backend (architecture.md §8, mesma origem).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # Configuração do ambiente, gerada no arranque: nunca em cache.
    location = /config.js {
        add_header Cache-Control "no-store";
    }

    # Ficheiros com hash no nome (Vite): podem ficar em cache.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Aplicação de página única: os caminhos do react-router devolvem o index.html.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
