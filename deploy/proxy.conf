# Proxy de entrada da verificação local (architecture.md §8): /api para as duas instâncias do
# backend (DT13), o resto para o frontend, tudo na mesma origem. Em produção o TLS termina no proxy
# ou no balanceador do fornecedor (DT06); este ficheiro não o configura.
upstream matriz_api {
    server backend-1:3000 max_fails=1 fail_timeout=10s;
    server backend-2:3000 max_fails=1 fail_timeout=10s;
}

upstream matriz_web {
    server frontend:80;
}

server {
    listen 80;
    server_tokens off;

    location /api/ {
        proxy_pass http://matriz_api;
        # Uma instância parada ou sem base de dados (503) passa o pedido à outra. O nginx não repete
        # pedidos não idempotentes (POST, PATCH) que já tenham sido enviados.
        proxy_next_upstream error timeout http_502 http_503;
        proxy_connect_timeout 2s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://matriz_web;
        proxy_set_header Host $host;
    }
}
